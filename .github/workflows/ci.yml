name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Unit & Integration Tests
        run: mvn -B test --file clinic-service/pom.xml

      - name: Package WAR Artifact
        run: mvn -B package -DskipTests --file clinic-service/pom.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: clinic-service/target/surefire-reports/
          retention-days: 7

      - name: Upload Built WAR
        uses: actions/upload-artifact@v4
        with:
          name: clinic-service-war
          path: clinic-service/target/*.war
          retention-days: 14
