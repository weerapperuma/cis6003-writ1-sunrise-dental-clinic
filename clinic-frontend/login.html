<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Dental Clinic – Staff Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="login-body">
<div class="card login-card">
    <h1>🦷 Sunrise Dental Clinic</h1>
    <h2>Staff Login</h2>
    <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="e.g. admin" autocomplete="username" required>
        
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        
        <button type="submit" id="submitBtn">Login</button>
        <div id="msg" class="msg err" style="display:none"></div>
    </form>
</div>

<script src="js/api.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const msg = document.getElementById('msg');
        const submitBtn = document.getElementById('submitBtn');

        if (!username || !password) {
            showMsg(msg, 'Username and password are required.', false);
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in...';

        try {
            const { status, data } = await api('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });

            console.log('Login response:', { status, data });

            if (status === 200 && data && data.success) {
                showMsg(msg, '✓ Login successful! Welcome, ' + (data.fullName || data.username), true);
                setTimeout(() => {
                    location.href = 'dashboard.html';
                }, 700);
            } else {
                const errText = (data && data.message) ? data.message : `Login failed (HTTP status ${status})`;
                showMsg(msg, errText, false);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        } catch (err) {
            console.error('Login error:', err);
            showMsg(msg, 'Connection error. Ensure Tomcat is running at http://localhost:8080', false);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
        }
    });
</script>
</body>
</html>
